worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Общий лимит запросов к API: 2 запроса/секунду на IP, плюс короткий burst.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;

    upstream backend_pool {
        # Docker Compose создаёт эти DNS-имена для двух контейнеров.
        server backend1:5000 max_fails=1 fail_timeout=5s;
        server backend2:5000 max_fails=1 fail_timeout=5s;
    }

    # HTTP всегда перенаправляет на HTTPS.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Неизвестный HTTPS-домен не должен показывать приложение.
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate     /etc/nginx/certs/local.crt;
        ssl_certificate_key /etc/nginx/certs/local.key;
        return 404 "Unknown host: no site is configured for this domain.\n";
    }

    # Основной сайт.
    server {
        listen 443 ssl;
        server_name app.local.test localhost;
        ssl_certificate     /etc/nginx/certs/local.crt;
        ssl_certificate_key /etc/nginx/certs/local.key;

        root /usr/share/nginx/html;
        index index.html;
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Без завершающего URI в proxy_pass nginx сохраняет исходный путь /api/....
        location /api/ {
            limit_req zone=api_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # alias связывает URL /docs/ с отдельной папкой.
        location /docs/ {
            alias /usr/share/nginx/docs/;
            index index.html;
        }

        # Оба варианта URL закрыты паролем; admin.html не лежит в публичной папке frontend.
        location = /admin {
            auth_basic "Admin area";
            auth_basic_user_file /etc/nginx/.htpasswd;
            alias /usr/share/nginx/admin/admin.html;
        }
        location = /admin/ {
            auth_basic "Admin area";
            auth_basic_user_file /etc/nginx/.htpasswd;
            alias /usr/share/nginx/admin/admin.html;
        }
    }

    # Второй виртуальный хост: отдельная статическая страница.
    server {
        listen 443 ssl;
        server_name other.local.test;
        ssl_certificate     /etc/nginx/certs/local.crt;
        ssl_certificate_key /etc/nginx/certs/local.key;

        root /usr/share/nginx/other;
        index index.html;
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
