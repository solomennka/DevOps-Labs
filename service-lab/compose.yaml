services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: dev_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d notesdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend1:
    profiles: ["lab1"]
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: notesdb
      DB_USER: appuser
      DB_PASSWORD: dev_password_123
      INSTANCE_ID: backend-1
    depends_on:
      db:
        condition: service_healthy

  backend2:
    profiles: ["lab1"]
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: notesdb
      DB_USER: appuser
      DB_PASSWORD: dev_password_123
      INSTANCE_ID: backend-2
    depends_on:
      db:
        condition: service_healthy

  nginx:
    profiles: ["lab1"]
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/docs:/usr/share/nginx/docs:ro
      - ./other-site:/usr/share/nginx/other:ro
      - ./admin:/usr/share/nginx/admin:ro
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - backend1
      - backend2

volumes:
  postgres_data:
